name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # `release.yml` calls this workflow before it tags anything, so a release can
  # never be cut from a red `main`.
  workflow_call:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest and translations
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        uses: hacs/action@main
        with:
          category: integration
          # `brands` only applies to repositories submitted to the default HACS
          # store; this one is installed as a custom repository.
          ignore: brands

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github custom_components

      - name: ruff format
        run: ruff format --check --diff custom_components

      - name: mypy
        run: mypy custom_components/ixmanager

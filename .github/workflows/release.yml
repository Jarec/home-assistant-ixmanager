name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifest version matches the tag
        run: |
          manifest_version="$(python3 -c "import json; print(json.load(open('custom_components/ixmanager/manifest.json'))['version'])")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Version $manifest_version matches tag $GITHUB_REF_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            custom_components/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
